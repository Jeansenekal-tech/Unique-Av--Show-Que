<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Show Output</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' media:; img-src 'self' media: data:; media-src 'self' media:; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
    #stage { position: absolute; inset: 0; }
    .layer { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; object-fit: contain; background: transparent; }
    #ident { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      color: #fff; font: 600 6vw system-ui, sans-serif; background: #1d5f3a; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="ident">OUTPUT</div>
  <script src="audio-router.js"></script>
  <script src="output.js"></script>
</body>
</html>
