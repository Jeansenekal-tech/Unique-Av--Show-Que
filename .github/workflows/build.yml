name: Build installers

# Every push to main builds the Windows installer and the Mac DMGs.
# If the version in package.json has not been released yet, they are also
# published together as a GitHub Release – installed apps pick it up as an update.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A published release means this version is done; a leftover draft
          # (from a run that failed) is reused and finished this time.
          DRAFT=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = "false" ]; then
            echo "publish=never" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is already released – building without publishing. Raise the version in package.json to publish an update."
          else
            echo "publish=always" >> "$GITHUB_OUTPUT"
            echo "Publishing version $VERSION."
            if [ "$DRAFT" = "none" ]; then
              # Create the draft once, so the Windows and Mac builds both upload into it.
              gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
                --title "Unique AV Show Cue $VERSION" --notes "Windows: download the Setup .exe. Mac: download the arm64 DMG (Apple Silicon), the x64 DMG (Intel, macOS 11 or newer) or the x64-catalina DMG (Intel Macs on macOS 10.15 Catalina)."
            fi
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            files: dist/*.exe
            name: Windows
          # Intel Mac runner: GitHub's Apple Silicon runners are often out of
          # capacity. It still builds both the arm64 and x64 DMGs.
          - os: macos-15-intel
            target: --mac
            files: |
              dist/*.dmg
              dist/*.zip
            name: Mac
          # Separate Intel build for macOS 10.15 Catalina. Electron 33+ needs
          # macOS 11, so this one uses Electron 32 (the last that supports 10.15).
          # It has its own update channel (catalina-mac.yml) so Catalina Macs
          # are only ever told about Catalina builds.
          - os: macos-15-intel
            target: >-
              --mac dmg --x64
              -c.publish.channel=catalina
              -c.extraMetadata.showcueFlavor=catalina
              -c.mac.minimumSystemVersion=10.15
              -c.mac.artifactName=Unique-AV-Show-Cue-\${version}-x64-catalina.\${ext}
            files: dist/*.dmg
            name: Mac-Catalina
            catalina: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Use Electron 32 for the Catalina build
        if: matrix.catalina
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund electron@32
          EV=$(node -p "require('electron/package.json').version")
          echo "Electron $EV"
          echo "EXTRA_ARGS=-c.electronVersion=$EV" >> "$GITHUB_ENV"
      - name: Stop Spotlight indexing (it holds DMG volumes open)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true
      - name: Build (and upload to a draft release when new)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          # macOS sometimes can't detach the DMG volume ("hdiutil detach" fails); try again.
          for attempt in 1 2 3; do
            npx electron-builder ${{ matrix.target }} $EXTRA_ARGS \
              --publish ${{ needs.version.outputs.publish }} \
              -c.publish.provider=github \
              -c.publish.owner=${{ github.repository_owner }} \
              -c.publish.repo=${{ github.event.repository.name }} \
              -c.publish.releaseType=draft && exit 0
            echo "Build attempt $attempt failed."
            if [ "$RUNNER_OS" = "macOS" ]; then
              for v in /Volumes/Unique*; do [ -d "$v" ] && hdiutil detach -force "$v" || true; done
            fi
            sleep 15
          done
          exit 1
      # Releases already hold the installers, so only keep a copy for builds that
      # don't publish. Running out of artifact storage must not fail the build.
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.publish != 'always'
        continue-on-error: true
        with:
          name: Unique-AV-Show-Cue-${{ matrix.name }}-${{ needs.version.outputs.version }}
          path: ${{ matrix.files }}
          retention-days: 5

  release:
    needs: [version, build]
    # Publish once the Windows installer is in the release, even if the Mac
    # build failed or never got a runner – Windows copies update themselves.
    if: always() && needs.version.outputs.publish == 'always'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "$ASSETS"
          if ! grep -qx 'latest.yml' <<<"$ASSETS"; then
            echo "::error::The Windows build is not in the release yet – not publishing."
            exit 1
          fi
          if ! grep -qx 'latest-mac.yml' <<<"$ASSETS"; then
            echo "::warning::The Mac build is missing from $TAG – publishing for Windows now. Re-run the failed Mac job to add it."
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
